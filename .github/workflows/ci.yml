name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Lint
        run: ./gradlew lint

      # AppTest валидируется на Android JVM через Robolectric
      # (composeApp/src/androidUnitTest/.../AppTestAndroid.kt с @RunWith(RobolectricTestRunner::class))
      # и на iOS через :composeApp:iosX64Test (см. ios job ниже).
      # NOTE: testDebugUnitTest only — release-variant unit tests не добавляют ценности
      # (release manifest без ComponentActivity → Robolectric ActivityScenario.launch падает;
      # debug variant покрывает весь test surface).
      - name: Run Android JVM tests (debug)
        run: ./gradlew testDebugUnitTest

      # Plan 09: sanitize-har-canary — fails CI if any non-approved Russian surname
      # leaks into committed fixtures/sanitized/. Plan 01 created the script;
      # Plan 02 populated fixtures/sanitized/account-{A,B}/*.har; Plan 09 wires
      # the gate so every push validates that no real PII slipped through the
      # tools/sanitize-har.py NAME_POOL substitution (Pitfall #1 closer — D-03/D-04).
      - name: Run sanitize-har canary
        run: bash tests/sanitize-har-canary.sh

      # Plan 09: log-redactor-canary — proves HttpRequestRedactor (Plan 04) keeps the
      # ROADMAP success #5 canary string `kanareyka_PASSWORD_DO_NOT_LEAK_42` out of
      # test stdout (D-28 mandatory addendum: redaction works in debug builds too).
      # Pitfall #5 closer — regression gate for password leakage.
      - name: Run log-redactor canary
        run: bash tests/log-redactor-canary.sh

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Select Xcode 16
        # Pitfall #4 mitigation: macos-15 runner может иметь несколько Xcode-версий;
        # explicit-select fixes "No SDK iphonesimulator" error if it occurs.
        # `|| echo` даёт безопасный fallback к default Xcode без маскирования реальных ошибок.
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_16.0.app || echo "Using default Xcode"

      - name: Verify Xcode version
        # BL-03 fix: реальный gate (не информационный). Если xcode-select fallback
        # выбрал не-Xcode-16 (default macos-15 image, или Xcode_16.app отсутствует),
        # `Verify` шаг fail-ит CI с понятным сообщением. Это закрывает Pitfall #4
        # mitigation, который ранее сам себя не закрывал — `head -1` всегда exit 0,
        # никаких assertion на major version не выполнялось.
        run: |
          set -euo pipefail
          XCODE_VERSION=$(xcodebuild -version | head -1)
          echo "Active Xcode: $XCODE_VERSION"
          echo "$XCODE_VERSION" | grep -qE '^Xcode 16\.' \
            || { echo "ERROR: expected Xcode 16.x, got '$XCODE_VERSION' (xcode-select fallback chose wrong toolchain)"; exit 1; }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run iOS X64 tests
        # Plan 09: extend the Phase 1 single-target invocation to cover all four KMP
        # modules with iOS Native tests. Concatenated into one gradle call for
        # daemon + Gradle config-cache + KSP klib cache reuse (~180s estimated
        # baseline → 4 separate steps would 4x cold-start overhead).
        # Order: leaf modules first (:core:database, :core:network) so failures
        # point at the closest cause; :core:api-avers-v4 next (consumes both via
        # type-only imports / Gradle project deps); :composeApp last as the
        # Phase 1 integration smoke entry-point.
        # Plan 09 Task 1 (Native HAR loader + FIXTURES_DIR env-var wiring) is what
        # makes :core:api-avers-v4:iosX64Test viable here — the 12 EndpointsContract
        # tests now run on iOS Native too (D-25: never live AVERS, sanitized HAR only).
        run: ./gradlew :core:database:iosX64Test :core:network:iosX64Test :core:api-avers-v4:iosX64Test :composeApp:iosX64Test

      - name: Link iOS X64 debug framework (verify privacyManifest plugin)
        # Plan 05 Task 3: BLOCKER 1 iter 2 mitigation — targeted insertion ПОСЛЕ
        # существующего "Run iOS X64 tests" step. Plan 03 структура (Android job
        # без Test step; Select Xcode 16 без continue-on-error; Verify Xcode version
        # present) — НЕ trogать.
        # Pitfall #2 closer: linkDebugFrameworkIosX64 запускает apple-privacy-manifests
        # plugin, который должен скопировать composeApp/PrivacyInfo.xcprivacy в
        # composeApp/build/bin/iosX64/debugFramework/composeApp.framework/PrivacyInfo.xcprivacy.
        run: ./gradlew :composeApp:linkDebugFrameworkIosX64

      - name: Lint PrivacyInfo.xcprivacy
        # D-26 CI lint: plutil -lint + grep CA92.1 + C617.1 + NSPrivacyTracking=false.
        # PLIST path = framework-embedded copy (integration check, что plugin
        # действительно упаковал manifest). Pitfall #3 mitigation: step размещён
        # ТОЛЬКО в jobs.ios.steps (plutil = macOS-only).
        run: |
          set -euo pipefail
          PLIST=composeApp/build/bin/iosX64/debugFramework/composeApp.framework/PrivacyInfo.xcprivacy

          echo "Step 1: plutil -lint (XML/plist syntax)"
          plutil -lint "$PLIST"

          echo "Step 2: verify reason code CA92.1 (NSPrivacyAccessedAPICategoryUserDefaults)"
          plutil -extract NSPrivacyAccessedAPITypes xml1 "$PLIST" -o - | grep -q 'CA92.1' \
            || (echo "ERROR: CA92.1 (NSPrivacyAccessedAPICategoryUserDefaults reason) missing" && exit 1)

          echo "Step 3: verify reason code C617.1 (NSPrivacyAccessedAPICategoryFileTimestamp)"
          plutil -extract NSPrivacyAccessedAPITypes xml1 "$PLIST" -o - | grep -q 'C617.1' \
            || (echo "ERROR: C617.1 (NSPrivacyAccessedAPICategoryFileTimestamp reason) missing" && exit 1)

          echo "Step 4: verify NSPrivacyTracking=false"
          plutil -extract NSPrivacyTracking raw "$PLIST" | grep -q '^false$' \
            || (echo "ERROR: NSPrivacyTracking must be false (T-01-03 mitigation)" && exit 1)

          echo "Step 5: verify NSPrivacyCollectedDataTypes is empty array (jq-based, robust to plutil output formatting)"
          # WR-06 fix: regex `<array(/| )` ловил только <array/> и <array ...>, не matched
          # `<array>` без whitespace и `<array\n` (multi-line empty arrays). Если Apple
          # plutil future-version поменяет formatting — check тихо false-negative-нет.
          # plutil -convert json + jq куда более robust: проверяем JSON-тип и длину.
          COLLECTED_JSON=$(plutil -convert json -o - "$PLIST")
          COLLECTED_TYPE=$(echo "$COLLECTED_JSON" | jq -r '.NSPrivacyCollectedDataTypes | type')
          test "$COLLECTED_TYPE" = "array" \
            || { echo "ERROR: NSPrivacyCollectedDataTypes must be JSON array (got type: $COLLECTED_TYPE)"; exit 1; }
          COLLECTED_LEN=$(echo "$COLLECTED_JSON" | jq -r '.NSPrivacyCollectedDataTypes | length')
          test "$COLLECTED_LEN" = "0" \
            || { echo "ERROR: NSPrivacyCollectedDataTypes must be empty in Phase 1 (got length: $COLLECTED_LEN)"; exit 1; }

          echo "PrivacyInfo.xcprivacy passes all required-reason checks."
